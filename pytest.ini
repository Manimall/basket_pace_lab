[pytest]
# Collect tests only from tests/ — keeps bare `pytest` from picking up
# scripts/run_parser_test.py (a manual diagnostic that matches the default
# *_test.py glob but is not a unit test and imports `src` from a context where
# it is not on sys.path).
testpaths = tests

# Put the repo root on sys.path so `from src...` resolves the same way whether
# pytest is invoked as `pytest`, `pytest -q`, or `pytest tests/`.
pythonpath = .

addopts = -q
